<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Techno World BD | সেরা দামে পাইকারি ও প্রি-অর্ডার গ্যাজেট শপ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['"Hind Siliguri"', 'sans-serif'] } } }
    }
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'Hind Siliguri', sans-serif; }
    @media print {
      body * { visibility: hidden; }
      #print-voucher, #print-voucher * { visibility: visible; }
      #print-voucher { position: absolute; left: 0; top: 0; width: 100%; border: none; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const SITE = {
      name: 'Techno World BD',
      phone: '01351003958',
      whatsapp: 'https://wa.me/8801351009358',
      telegram: 'https://t.me/technoworldbd1',
      fb: 'https://www.facebook.com/technoworlbd',
      devName: 'Jainal Abedin',
      devRole: 'CEO, Dream Career IT BD',
      devUrl: 'https://dcitbd.github.io/Jainal-Abedin/'
    };

    const PRODUCTS = [
      { id: 'p1', sku: 'HWT-GT4-01', name: 'Huawei Watch GT 4 Pro Smartwatch (Dubai Edition)', cat: 'স্মার্টওয়াচ', price: 24500, mrp: 28500, wholesale: 21500, weight: 0.45, stock: 35 },
      { id: 'p2', sku: 'OPW-02-BLK', name: 'OnePlus Watch 2 Dual-Engine Smartwatch', cat: 'স্মার্টওয়াচ', price: 29500, mrp: 34000, wholesale: 26500, weight: 0.5, stock: 18 },
      { id: 'p3', sku: 'AMZ-GTR4-SLV', name: 'Amazfit GTR 4 Smart Fitness Watch', cat: 'স্মার্টওয়াচ', price: 20500, mrp: 24500, wholesale: 17800, weight: 0.4, stock: 25 },
      { id: 'p4', sku: 'HYL-RS4-PLUS', name: 'Haylou RS4 Plus Retina Display Smartwatch', cat: 'স্মার্টওয়াচ', price: 4600, mrp: 5800, wholesale: 3850, weight: 0.35, stock: 60 },
      { id: 'p5', sku: 'TW-TORCH-PRO', name: 'Techno Ultra Long-Range Zoom Rechargeable LED Torch (1500m)', cat: 'টর্চলাইট', price: 2450, mrp: 3200, wholesale: 1950, weight: 0.85, stock: 85 },
      { id: 'p6', sku: 'TW-SPOT-50W', name: 'High-Power Tactical Spotlight Flashlight with PowerBank', cat: 'টর্চলাইট', price: 3400, mrp: 4500, wholesale: 2800, weight: 1.2, stock: 40 },
      { id: 'p7', sku: 'ANK-SPK-MINI', name: 'Anker Soundcore Mini 3 Bluetooth Multimedia Speaker', cat: 'অডিও', price: 3450, mrp: 4200, wholesale: 2950, weight: 0.4, stock: 30 },
      { id: 'p8', sku: 'DB-OLED-LAP', name: 'Dubai Pre-Order: High-End Custom OLED Laptop', cat: 'দুবাই প্রি-অর্ডার', price: 148000, mrp: 165000, wholesale: 140000, weight: 2.2, stock: 0 },
      { id: 'p9', sku: 'OFF-FILE-HLD', name: 'Executive Single-File Document Desk Holder & Organizer', cat: 'অফিস সাপ্লাই', price: 750, mrp: 950, wholesale: 550, weight: 0.6, stock: 120 },
      { id: 'p10', sku: 'OFF-MAG-RCK', name: 'Multi-Compartment Steel Magazine & Catalog Rack', cat: 'অফিস সাপ্লাই', price: 1450, mrp: 1850, wholesale: 1150, weight: 1.4, stock: 55 },
      { id: 'p11', sku: 'ACC-MACA-PW', name: 'Organic Energy Supplement Powder (Dubai Direct)', cat: 'সাপ্লিমেন্ট', price: 2250, mrp: 2800, wholesale: 1850, weight: 0.5, stock: 45 },
      { id: 'p12', sku: 'GAS-STV-RNG', name: 'Heavy Duty Infrared Energy Saving Gas Stove Burner Ring', cat: 'হোম গ্যাজেট', price: 650, mrp: 850, wholesale: 480, weight: 0.4, stock: 90 }
    ];

    function calcDelivery(method, area, weightKg) {
      if (method === 'office') return 0;
      const base = area === 'inside' ? 90 : 130;
      const extra = weightKg > 1.0 ? Math.ceil(weightKg - 1.0) * 20 : 0;
      return base + extra;
    }

    function getInitialView() {
      const h = window.location.hash;
      if (h === '#admin') return 'admin';
      if (h === '#track') return 'track';
      if (h === '#checkout' || h === '#cart') return 'checkout';
      if (h === '#wishlist') return 'wishlist';
      return 'home';
    }

    function App() {
      const [view, setView] = useState(getInitialView);
      const [cart, setCart] = useState([]);
      const [wishlist, setWishlist] = useState([]);
      const [search, setSearch] = useState('');
      const [selectedCat, setSelectedCat] = useState('');
      const [orders, setOrders] = useState([
        { id: 'TWBD-748921', name: 'Rahim Ullah', phone: '01812345678', address: 'Dhanmondi, Dhaka', items: [{ name: 'Huawei Watch GT 4 Pro', qty: 1, price: 24500 }], subtotal: 24500, delivery: 90, total: 24590, payment: 'cod', status: 'Pending', date: '17/09/2026' }
      ]);
      const [voucher, setVoucher] = useState(null);
      const [bannerIdx, setBannerIdx] = useState(0);

      // Admin Auth State
      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(() => localStorage.getItem('twbd_admin_auth') === 'true');
      const [adminUser, setAdminUser] = useState('');
      const [adminPass, setAdminPass] = useState('');
      const [adminError, setAdminError] = useState('');

      // Checkout State
      const [name, setName] = useState('');
      const [phone, setPhone] = useState('');
      const [address, setAddress] = useState('');
      const [method, setMethod] = useState('home');
      const [area, setArea] = useState('inside');
      const [payment, setPayment] = useState('cod');

      const banners = [
        'দুবাই ও রাশিয়া প্রি-অর্ডার গ্যাজেট হাব 🔥 ১০০% ইনটেক পণ্য',
        'পাইকারি দামে স্মার্টওয়াচ ও টর্চলাইট (১০ পিসে বিশেষ ছাড়)',
        'সারা বাংলাদেশে ক্যাশ অন ডেলিভারি ও ২ সপ্তাহ রিপ্লেসমেন্ট গ্যারান্টি'
      ];

      // Handle URL Hash navigation
      useEffect(() => {
        const handleHash = () => {
          setView(getInitialView());
        };
        window.addEventListener('hashchange', handleHash);
        return () => window.removeEventListener('hashchange', handleHash);
      }, []);

      const navigate = (v) => {
        setView(v);
        window.location.hash = v;
      };

      useEffect(() => {
        const t = setInterval(() => setBannerIdx(i => (i + 1) % banners.length), 3500);
        return () => clearInterval(t);
      }, []);

      const handleAdminLogin = (e) => {
        e.preventDefault();
        const u = adminUser.trim();
        const p = adminPass.trim();
        if ((u === '01351003958' || u === 'admin') && (p === '01351003958' || p === 'admin123' || p === '123456')) {
          setIsAdminLoggedIn(true);
          localStorage.setItem('twbd_admin_auth', 'true');
          setAdminError('');
        } else {
          setAdminError('ভুল মোবাইল নম্বর বা পাসওয়ার্ড! সঠিক তথ্য দিন।');
        }
      };

      const handleAdminLogout = () => {
        setIsAdminLoggedIn(false);
        localStorage.removeItem('twbd_admin_auth');
        setAdminUser('');
        setAdminPass('');
      };

      const addToCart = (p) => {
        setCart(prev => {
          const ex = prev.find(item => item.id === p.id);
          if (ex) return prev.map(item => item.id === p.id ? { ...item, qty: item.qty + 1 } : item);
          return [...prev, { ...p, qty: 1 }];
        });
      };

      const updateQty = (id, delta) => {
        setCart(prev => prev.map(i => i.id === id ? { ...i, qty: Math.max(1, i.qty + delta) } : i));
      };

      const removeItem = (id) => setCart(prev => prev.filter(i => i.id !== id));

      const toggleWish = (p) => {
        setWishlist(prev => prev.some(i => i.id === p.id) ? prev.filter(i => i.id !== p.id) : [...prev, p]);
      };

      const subtotal = cart.reduce((acc, i) => acc + i.price * i.qty, 0);
      const totalWeight = cart.reduce((acc, i) => acc + i.weight * i.qty, 0);
      const delivery = calcDelivery(method, area, totalWeight);
      const grandTotal = subtotal + delivery;

      const handleCheckout = (e) => {
        e.preventDefault();
        if (!name || !phone) return alert('নাম ও ফোন নম্বর দিন');
        const orderId = 'TWBD-' + Math.floor(100000 + Math.random() * 900000);
        const orderData = {
          id: orderId,
          name, phone, address: method === 'office' ? 'অফিস কালেকশন (মহেশখালী)' : address,
          items: [...cart], subtotal, delivery, total: grandTotal, payment,
          date: new Date().toLocaleDateString('bn-BD'), status: 'Pending'
        };
        setOrders([orderData, ...orders]);
        setCart([]);
        setVoucher(orderData);
        navigate('track');
      };

      const filtered = useMemo(() => {
        return PRODUCTS.filter(p => {
          const mCat = !selectedCat || p.cat === selectedCat;
          const mSearch = !search || p.name.toLowerCase().includes(search.toLowerCase()) || p.sku.toLowerCase().includes(search.toLowerCase());
          return mCat && mSearch;
        });
      }, [selectedCat, search]);

      return (
        <div className="min-h-screen flex flex-col justify-between">
          <div>
            {/* Top Bar */}
            <div className="bg-slate-900 text-slate-300 text-xs py-2 px-4 flex justify-between items-center">
              <span>🔥 ১০০% অরিজিনাল গ্যাজেট | হটলাইন: <a href={SITE.whatsapp} className="text-emerald-400 font-bold">{SITE.phone}</a></span>
              <div className="space-x-3 text-[11px]">
                <a href={SITE.telegram} target="_blank" className="text-sky-400 hover:underline">টেলিগ্রাম</a>
                <a href={SITE.fb} target="_blank" className="text-blue-400 hover:underline">ফেসবুক</a>
              </div>
            </div>

            {/* Navbar */}
            <header className="sticky top-0 bg-white border-b shadow-sm z-30 px-4 py-3">
              <div className="max-w-6xl mx-auto flex items-center justify-between gap-4">
                <div onClick={() => { setSelectedCat(''); navigate('home'); }} className="cursor-pointer font-black text-lg tracking-tight text-slate-900">
                  TECHNO WORLD <span className="text-emerald-600">BD</span>
                </div>
                <div className="flex-1 max-w-sm hidden sm:block">
                  <input
                    type="text"
                    value={search}
                    onChange={e => setSearch(e.target.value)}
                    placeholder="নাম বা SKU দিয়ে খুঁজুন..."
                    className="w-full px-3 py-1.5 bg-slate-100 rounded-full text-xs outline-none border focus:border-emerald-500"
                  />
                </div>
                <div className="flex items-center space-x-3 text-xs font-bold">
                  <button onClick={() => navigate('home')} className={view === 'home' ? 'text-emerald-600' : 'hover:text-emerald-600'}>হোম</button>
                  <button onClick={() => navigate('track')} className={view === 'track' ? 'text-emerald-600' : 'hover:text-emerald-600'}>ট্র্যাক</button>
                  <button onClick={() => navigate('wishlist')} className="relative text-rose-500">
                    ❤️ {wishlist.length > 0 && <span className="text-[10px] bg-rose-500 text-white rounded-full px-1">{wishlist.length}</span>}
                  </button>
                  <button onClick={() => navigate('checkout')} className="relative text-emerald-600">
                    🛒 {cart.length > 0 && <span className="text-[10px] bg-emerald-600 text-white rounded-full px-1">{cart.length}</span>}
                  </button>
                  <button onClick={() => navigate('admin')} className={`px-2.5 py-1 rounded-full text-[11px] ${view === 'admin' ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-white'}`}>এডমিন</button>
                </div>
              </div>
            </header>

            {/* Main Content Area */}
            <main className="max-w-6xl mx-auto px-4 py-6">
              
              {/* VIEW: HOME */}
              {view === 'home' && (
                <div className="space-y-8">
                  {/* Banner */}
                  <div className="bg-gradient-to-r from-slate-900 to-slate-800 text-white p-6 sm:p-8 rounded-2xl shadow-md text-center">
                    <span className="text-xs bg-emerald-500/20 text-emerald-300 font-bold px-3 py-1 rounded-full">দুবাই প্রি-অর্ডার ও হোলসেল</span>
                    <h2 className="text-xl sm:text-2xl font-black mt-3">{banners[bannerIdx]}</h2>
                    <p className="text-xs text-slate-300 mt-2">সেরা পাইকারি ও খুচরা মূল্যে গ্যাজেট ও ইলেকট্রনিক্স সমগ্র বাংলাদেশ জুড়ে</p>
                    <div className="mt-4 flex justify-center gap-3">
                      <a href={SITE.whatsapp} target="_blank" className="px-4 py-2 bg-emerald-500 text-slate-950 font-bold rounded-xl text-xs hover:bg-emerald-400">
                        সরাসরি হোয়াটসঅ্যাপে অর্ডার
                      </a>
                    </div>
                  </div>

                  {/* Categories Filter */}
                  <div className="flex gap-2 overflow-x-auto pb-1 text-xs">
                    {['', 'স্মার্টওয়াচ', 'টর্চলাইট', 'অডিও', 'দুবাই প্রি-অর্ডার', 'অফিস সাপ্লাই', 'সাপ্লিমেন্ট', 'হোম গ্যাজেট'].map(c => (
                      <button
                        key={c}
                        onClick={() => setSelectedCat(c)}
                        className={`px-3 py-1.5 rounded-full font-bold whitespace-nowrap border ${selectedCat === c ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white text-slate-700 hover:bg-slate-100'}`}
                      >
                        {c || 'সব ক্যাটাগরি'}
                      </button>
                    ))}
                  </div>

                  {/* Products Grid */}
                  <div>
                    <h3 className="text-base font-bold mb-3 border-b pb-2">প্রোডাক্ট তালিকা ({filtered.length})</h3>
                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                      {filtered.map(p => (
                        <div key={p.id} className="bg-white border rounded-2xl p-3 flex flex-col justify-between hover:shadow-sm">
                          <div>
                            <span className="text-[10px] font-mono text-emerald-600 font-bold">SKU: {p.sku}</span>
                            <h4 className="text-xs font-bold mt-1 line-clamp-2">{p.name}</h4>
                            <div className="mt-2 flex items-baseline gap-1.5">
                              <span className="text-sm font-black">৳{p.price}</span>
                              <span className="text-[11px] text-slate-400 line-through">৳{p.mrp}</span>
                            </div>
                            <span className="text-[10px] text-emerald-600 font-semibold block">পাইকারি: ৳{p.wholesale} (১০+ পিস)</span>
                          </div>
                          <div className="mt-3 pt-2 border-t flex flex-col gap-1.5">
                            <button onClick={() => { addToCart(p); navigate('checkout'); }} className="w-full py-1.5 bg-emerald-600 text-white text-xs font-bold rounded-lg hover:bg-emerald-700">
                              অর্ডার করুন
                            </button>
                            <div className="grid grid-cols-2 gap-1 text-[11px]">
                              <button onClick={() => addToCart(p)} className="py-1 border rounded hover:bg-slate-50 font-semibold">কার্ট</button>
                              <button onClick={() => toggleWish(p)} className="py-1 border rounded hover:bg-slate-50 font-semibold">❤️ লাভ</button>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* VIEW: CHECKOUT */}
              {view === 'checkout' && (
                <div className="max-w-3xl mx-auto">
                  <h2 className="text-lg font-bold mb-4">চেকআউট ও ডেলিভারি অর্ডার</h2>
                  {cart.length === 0 ? (
                    <div className="p-8 text-center bg-white border rounded-2xl">
                      <p className="text-xs text-slate-500">আপনার কার্টে কোনো প্রোডাক্ট নেই।</p>
                      <button onClick={() => navigate('home')} className="mt-3 px-4 py-2 bg-emerald-600 text-white text-xs font-bold rounded-lg">শপে ফিরে যান</button>
                    </div>
                  ) : (
                    <form onSubmit={handleCheckout} className="grid grid-cols-1 md:grid-cols-12 gap-6">
                      <div className="md:col-span-7 bg-white p-4 border rounded-2xl space-y-3 text-xs">
                        <h3 className="font-bold border-b pb-2">ডেলিভারি তথ্য</h3>
                        <div>
                          <label className="block mb-1 font-semibold">নাম *</label>
                          <input type="text" value={name} onChange={e=>setName(e.target.value)} required placeholder="আপনার নাম লিখুন" className="w-full p-2 border rounded-lg" />
                        </div>
                        <div>
                          <label className="block mb-1 font-semibold">১১ ডিজিটের মোবাইল নম্বর *</label>
                          <input type="tel" value={phone} onChange={e=>setPhone(e.target.value)} required placeholder="01351003958" className="w-full p-2 border rounded-lg font-mono" />
                        </div>
                        <div>
                          <label className="block mb-1 font-semibold">ডেলিভারি পদ্ধতি</label>
                          <select value={method} onChange={e=>setMethod(e.target.value)} className="w-full p-2 border rounded-lg">
                            <option value="home">Home Delivery (বাসায় ডেলিভারি)</option>
                            <option value="office">Collect from Office (অফিস থেকে সংগ্রহ - ০ টাকা)</option>
                          </select>
                        </div>
                        {method !== 'office' && (
                          <>
                            <div>
                              <label className="block mb-1 font-semibold">ডেলিভারি এলাকা</label>
                              <select value={area} onChange={e=>setArea(e.target.value)} className="w-full p-2 border rounded-lg">
                                <option value="inside">ঢাকার ভেতরে (৯০ টাকা + ২০/কেজি)</option>
                                <option value="outside">ঢাকার বাইরে (১৩০ টাকা + ২০/কেজি)</option>
                              </select>
                            </div>
                            <div>
                              <label className="block mb-1 font-semibold">সম্পূর্ণ ঠিকানা *</label>
                              <textarea rows={2} value={address} onChange={e=>setAddress(e.target.value)} required placeholder="বাড়ি, রাস্তা ও জেলা" className="w-full p-2 border rounded-lg" />
                            </div>
                          </>
                        )}
                      </div>

                      <div className="md:col-span-5 bg-white p-4 border rounded-2xl space-y-3 text-xs">
                        <h3 className="font-bold border-b pb-2">অর্ডার সারাংশ</h3>
                        <div className="divide-y max-h-48 overflow-y-auto">
                          {cart.map(i => (
                            <div key={i.id} className="py-2 flex justify-between items-center">
                              <div>
                                <p className="font-bold">{i.name}</p>
                                <p className="text-slate-500">৳{i.price} × {i.qty}</p>
                              </div>
                              <div className="flex items-center gap-1">
                                <button type="button" onClick={() => updateQty(i.id, -1)} className="px-1.5 py-0.5 border rounded">-</button>
                                <span className="px-1">{i.qty}</span>
                                <button type="button" onClick={() => updateQty(i.id, 1)} className="px-1.5 py-0.5 border rounded">+</button>
                                <button type="button" onClick={() => removeItem(i.id)} className="ml-1 text-rose-500 font-bold">×</button>
                              </div>
                            </div>
                          ))}
                        </div>
                        <div className="border-t pt-2 space-y-1">
                          <div className="flex justify-between"><span>সাবটোটাল:</span><span>৳{subtotal}</span></div>
                          <div className="flex justify-between"><span>ডেলিভারি চার্জ ({totalWeight.toFixed(1)}kg):</span><span className="font-bold text-emerald-600">৳{delivery}</span></div>
                          <div className="flex justify-between font-black text-sm pt-2 border-t"><span>সর্বমোট প্রদেয়:</span><span className="text-emerald-600">৳{grandTotal}</span></div>
                        </div>
                        <button type="submit" className="w-full py-2.5 bg-emerald-600 text-white font-bold rounded-xl text-sm hover:bg-emerald-700">
                          অর্ডার কনফার্ম করুন (৳{grandTotal})
                        </button>
                      </div>
                    </form>
                  )}
                </div>
              )}

              {/* VIEW: ORDER TRACK & VOUCHER */}
              {view === 'track' && (
                <div className="max-w-xl mx-auto space-y-4">
                  <h2 className="text-lg font-bold">অর্ডার ট্র্যাকিং ও চালান ভাউচার</h2>
                  {voucher ? (
                    <div id="print-voucher" className="bg-white border-2 border-slate-300 rounded-2xl p-6 text-xs space-y-3">
                      <div className="flex justify-between border-b pb-3">
                        <div>
                          <h3 className="text-base font-black">{SITE.name}</h3>
                          <p className="text-slate-500">Maheshkhali, Coxs Bazar • {SITE.phone}</p>
                        </div>
                        <div className="text-right">
                          <span className="font-mono font-bold text-emerald-600">{voucher.id}</span>
                          <p className="text-[10px] text-slate-400">{voucher.date}</p>
                        </div>
                      </div>
                      <div className="border-b pb-2">
                        <p><strong>কাস্টমার:</strong> {voucher.name} ({voucher.phone})</p>
                        <p><strong>ঠিকানা:</strong> {voucher.address}</p>
                        <p><strong>স্ট্যাটাস:</strong> <span className="text-emerald-600 font-bold">{voucher.status}</span></p>
                      </div>
                      <div className="divide-y">
                        {voucher.items.map((it, idx) => (
                          <div key={idx} className="py-1.5 flex justify-between">
                            <span>{it.name} × {it.qty}</span>
                            <span className="font-mono">৳{it.price * it.qty}</span>
                          </div>
                        ))}
                      </div>
                      <div className="border-t pt-2 text-right font-black text-sm">
                        সর্বমোট বিল: ৳{voucher.total}
                      </div>
                      <div className="pt-2 text-center print:hidden">
                        <button onClick={() => window.print()} className="px-4 py-1.5 bg-slate-900 text-white rounded-lg text-xs font-bold">
                          🖨️ ভাউচার প্রিন্ট করুন
                        </button>
                      </div>
                    </div>
                  ) : (
                    <p className="text-xs text-slate-500">কোনো সাম্প্রতিক অর্ডার নেই।</p>
                  )}
                </div>
              )}

              {/* VIEW: WISHLIST */}
              {view === 'wishlist' && (
                <div>
                  <h2 className="text-lg font-bold mb-3">পছন্দের তালিকা ({wishlist.length})</h2>
                  {wishlist.length === 0 ? <p className="text-xs text-slate-500">কোনো প্রোডাক্ট ফেভারিট করা নেই।</p> : (
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                      {wishlist.map(p => (
                        <div key={p.id} className="bg-white border p-3 rounded-2xl text-xs space-y-2">
                          <h4 className="font-bold">{p.name}</h4>
                          <p className="font-black text-emerald-600">৳{p.price}</p>
                          <button onClick={() => { addToCart(p); navigate('checkout'); }} className="w-full py-1 bg-emerald-600 text-white rounded font-bold">অর্ডার নাও</button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}

              {/* VIEW: ADMIN (WITH LOGIN & DASHBOARD) */}
              {view === 'admin' && (
                <div>
                  {!isAdminLoggedIn ? (
                    <div className="max-w-md mx-auto bg-white border-2 border-slate-200 rounded-3xl p-6 sm:p-8 shadow-sm">
                      <div className="text-center mb-6">
                        <div className="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-2xl mx-auto flex items-center justify-center text-xl mb-3">
                          🔐
                        </div>
                        <h2 className="text-lg font-bold text-slate-900">এডমিন প্যানেল লগইন</h2>
                        <p className="text-xs text-slate-500 mt-1">Techno World BD ম্যানেজমেন্ট সিস্টেমে স্বাগতম</p>
                      </div>

                      {adminError && (
                        <div className="mb-4 p-2.5 bg-rose-50 border border-rose-200 text-rose-600 text-xs rounded-xl text-center font-medium">
                          {adminError}
                        </div>
                      )}

                      <form onSubmit={handleAdminLogin} className="space-y-4 text-xs">
                        <div>
                          <label className="block font-bold mb-1 text-slate-700">এডমিন মোবাইল নম্বর বা ইউজার</label>
                          <input
                            type="text"
                            value={adminUser}
                            onChange={e => setAdminUser(e.target.value)}
                            required
                            placeholder="01351003958"
                            className="w-full p-2.5 border rounded-xl outline-none focus:border-emerald-500 font-mono"
                          />
                        </div>
                        <div>
                          <label className="block font-bold mb-1 text-slate-700">পাসওয়ার্ড</label>
                          <input
                            type="password"
                            value={adminPass}
                            onChange={e => setAdminPass(e.target.value)}
                            required
                            placeholder="••••••••"
                            className="w-full p-2.5 border rounded-xl outline-none focus:border-emerald-500"
                          />
                        </div>
                        <button
                          type="submit"
                          className="w-full py-2.5 bg-slate-900 hover:bg-emerald-600 text-white font-bold rounded-xl text-xs transition duration-200"
                        >
                          লগইন করুন →
                        </button>
                      </form>

                      <div className="mt-4 pt-4 border-t text-center">
                        <button onClick={() => navigate('home')} className="text-xs text-slate-500 hover:text-emerald-600 font-semibold">
                          ← সাধারণ শপ ভিউতে ফিরে যান
                        </button>
                      </div>
                    </div>
                  ) : (
                    <div className="bg-white border rounded-2xl p-4 sm:p-6 text-xs space-y-5">
                      <div className="flex justify-between items-center border-b pb-3">
                        <div>
                          <h3 className="font-bold text-sm text-slate-900">এডমিন কন্ট্রোল ড্যাশবোর্ড</h3>
                          <span className="text-[11px] text-emerald-600 font-semibold">লগইন রয়েছেন: 01351003958</span>
                        </div>
                        <button
                          onClick={handleAdminLogout}
                          className="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold rounded-lg text-xs"
                        >
                          লগআউট (Logout)
                        </button>
                      </div>

                      {/* Stat Cards */}
                      <div className="grid grid-cols-3 gap-3 text-center">
                        <div className="p-3 bg-slate-50 border rounded-xl"><p className="text-slate-500">মোট প্রোডাক্ট</p><p className="font-bold text-base mt-1">{PRODUCTS.length}</p></div>
                        <div className="p-3 bg-slate-50 border rounded-xl"><p className="text-slate-500">মোট অর্ডার</p><p className="font-bold text-base mt-1">{orders.length}</p></div>
                        <div className="p-3 bg-slate-50 border rounded-xl"><p className="text-slate-500">মোট বিক্রি</p><p className="font-bold text-base text-emerald-600 mt-1">৳{orders.reduce((a,b)=>a+b.total,0)}</p></div>
                      </div>

                      {/* Order Management */}
                      <div>
                        <h4 className="font-bold mb-2 text-slate-800">অর্ডার ম্যানেজমেন্ট ({orders.length})</h4>
                        <div className="divide-y border rounded-xl overflow-x-auto">
                          {orders.map((o, idx) => (
                            <div key={o.id} className="p-3 flex justify-between items-center whitespace-nowrap gap-4">
                              <div>
                                <span className="font-mono font-bold text-emerald-600">{o.id}</span>
                                <p className="font-semibold text-slate-800">{o.name} • {o.phone}</p>
                                <p className="text-[11px] text-slate-400">{o.address}</p>
                              </div>
                              <div className="text-right">
                                <span className="font-black text-slate-900">৳{o.total}</span>
                                <p className="text-[10px] text-slate-400 uppercase">{o.payment}</p>
                              </div>
                              <div>
                                <select
                                  value={o.status}
                                  onChange={e => {
                                    const copy = [...orders];
                                    copy[idx].status = e.target.value;
                                    setOrders(copy);
                                  }}
                                  className="border p-1 rounded font-bold text-xs bg-slate-50"
                                >
                                  <option value="Pending">Pending</option>
                                  <option value="Confirmed">Confirmed</option>
                                  <option value="Sent">Sent (Courier)</option>
                                  <option value="Delivered">Delivered</option>
                                  <option value="Cancelled">Cancelled</option>
                                </select>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}

            </main>
          </div>

          {/* Footer */}
          <footer className="bg-slate-900 text-slate-400 text-xs py-6 border-t mt-8">
            <div className="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-2 text-center">
              <div>© ২০২৬ {SITE.name} • পাইকারি ও প্রি-অর্ডার গ্যাজেট হাব</div>
              <div>
                কারিগরি সহযোগিতা: <a href={SITE.devUrl} target="_blank" className="text-emerald-400 font-bold hover:underline">{SITE.devName}</a>, {SITE.devRole}
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
